name: Build Android APK

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout dosbox-pure core
        uses: actions/checkout@v4
        with:
          repository: libretro/dosbox-pure
          path: .ci-dosbox-pure

      - name: Build DOSBox-Pure arm64-v8a core
        run: |
          NDK_DIR="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "Using NDK: $NDK_DIR"
          cd .ci-dosbox-pure/jni
          "$NDK_DIR/ndk-build" -j"$(nproc)" APP_ABI=arm64-v8a APP_PLATFORM=android-24
          mkdir -p ../../packages/dosbox_engine/android/src/main/jniLibs/arm64-v8a
          cp ../libs/arm64-v8a/libretro.so \
            ../../packages/dosbox_engine/android/src/main/jniLibs/arm64-v8a/libdosbox_pure_libretro_android.so
          ls -lh ../../packages/dosbox_engine/android/src/main/jniLibs/arm64-v8a/libdosbox_pure_libretro_android.so

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze Dart code
        working-directory: app
        run: flutter analyze

      - name: Run unit tests
        working-directory: app
        run: flutter test

      - name: Build Android Release APK (arm64-v8a)
        working-directory: app
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dosbox-cn-android-arm64-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
