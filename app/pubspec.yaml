name: dosbox_cn
description: 华语 DOS 怀旧盒 - 开源经典中文 DOS 游戏移动模拟器 (Flutter + DOSBox-Pure)
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  dosbox_engine:
    path: ../packages/dosbox_engine
  crypto: ^3.0.3
  file_picker: ^8.1.2
  http: ^1.2.2
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
