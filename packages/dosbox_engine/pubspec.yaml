name: dosbox_engine
description: Cross-platform Flutter plugin wrapping a lightweight C++17 Libretro host for DOSBox-Pure.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.gs.dosbox_engine
        pluginClass: DosboxEnginePlugin
      ios:
        pluginClass: DosboxEnginePlugin
